name = "cmdpad-web"
main = "worker.js"
compatibility_date = "2025-09-01"

# PWA 静态资源目录（index.html / sw.js / manifest / 图标）
assets = { directory = "./public" }

# KV 存储：CmdPad 上传的命令数据。id 在部署时替换（见 DEPLOY.md 第 3 步），
# 属于个人部署配置，不入仓库（本机可 git update-index --skip-worktree 保留真实值）
[[kv_namespaces]]
binding = "CMDPAD_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
